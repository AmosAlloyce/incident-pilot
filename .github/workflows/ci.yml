name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Seed database
        run: PYTHONPATH=src python -m incident_pilot.db.seed

      - name: Run tests
        run: PYTHONPATH=src pytest tests/ -v
        # No GROQ_API_KEY needed — all Groq calls are mocked in unit tests
